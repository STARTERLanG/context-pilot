[project]
name = "context-pilot"
version = "0.0.1"
description = "面向 AI Coding Agent 的项目感知型 Prompt Enhancement 桌面工具"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyside6>=6.7",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
context-pilot = "context_pilot.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 静态检查未定义名（NameError 只在运行到那行时才炸，compileall 抓不到）
    "pyflakes>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
